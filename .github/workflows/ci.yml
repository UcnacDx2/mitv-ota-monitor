name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint scheduler changes
        run: npx oxlint lib/ota/scheduled.ts worker/index.ts app/api/cron/route.ts app/api/status/route.ts
      - name: Repository lint (legacy issues are non-blocking)
        continue-on-error: true
        run: npm run lint
      - run: npm run build
